name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Conn3x
        env: &gh
          GH_TOKEN: ${{ github.token }}
        run: &install |
          tag=$(gh release view -R conn3xorg/conn3x --json tagName -q .tagName)
          file="conn3x_${tag#v}_linux_amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfLO "https://github.com/conn3xorg/conn3x/releases/download/$tag/$file"
          curl -sSfLO "https://github.com/conn3xorg/conn3x/releases/download/$tag/checksums.txt"
          grep " $file\$" checksums.txt | sha256sum -c -
          mkdir -p bin && tar -xzf "$file" -C bin conn3x
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: conn3x version
      - run: conn3x fmt -check -recursive
      - name: Validate
        run: conn3x init -backend=false && conn3x validate
      - name: Validate the example
        working-directory: examples/local
        run: conn3x init -backend=false && conn3x validate

  e2e:
    needs: validate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        distro: [rocky10, fedora45, ubuntu2404, debian13]
    name: e2e (${{ matrix.distro }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The test host images live in the Conn3x repo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: conn3xorg/conn3x
          ref: main
          path: conn3x
          persist-credentials: false
          sparse-checkout: test/images
      - name: Install Conn3x
        env: *gh
        run: *install
      - name: Start the ${{ matrix.distro }} host
        working-directory: examples/local
        env:
          CONTAINERFILE: ${{ github.workspace }}/conn3x/test/images/${{ matrix.distro }}/Containerfile
        run: ./up.sh
      - name: Apply, then plan again with no changes
        working-directory: examples/local
        run: |
          conn3x init
          conn3x apply -auto-approve
          conn3x plan -detailed-exitcode
      # node_exporter from circuit-node-exporter is the node job's target.
      - name: Check Prometheus scrapes node_exporter
        run: |
          podman exec -i circuit-prometheus sh -eu <<'EOF'
          t='localhost:9090/api/v1/targets?state=active'
          up='"scrapeUrl":"http://localhost:9100/metrics"[^}]*"health":"up"'
          for _ in $(seq 60); do
            curl -sf "$t" | grep -q "$up" && break
            sleep 1
          done
          curl -sf "$t" | grep -q "$up"
          curl -sf 'localhost:9090/api/v1/query?query=up%7Bjob%3D%22node%22%7D' | grep -q '"value":\[[0-9.]*,"1"\]'
          EOF
      # A config change should reload Prometheus, not restart it.
      - name: Change the scrape interval, then check it reloaded in place
        working-directory: examples/local
        run: |
          pid=$(podman exec circuit-prometheus systemctl show -P MainPID prometheus)
          conn3x apply -auto-approve -var scrape_interval=20s
          conn3x plan -detailed-exitcode -var scrape_interval=20s
          [ "$(podman exec circuit-prometheus systemctl show -P MainPID prometheus)" = "$pid" ]
          podman exec circuit-prometheus curl -sf localhost:9090/api/v1/status/config | grep -q 'scrape_interval: 20s'
      - name: Clean up
        if: always()
        working-directory: examples/local
        run: ./down.sh
